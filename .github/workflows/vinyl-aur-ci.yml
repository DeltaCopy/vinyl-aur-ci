# Build Vinyl and publish release
name: Vinyl AUR CI
on:
  schedule:
    - cron: "0 00 * * *" # At 00:00 daily
env:
  AUR_VINYL_REPO: https://aur.archlinux.org/vinyl.git
  GIT_USER: DeltaCopy
  GIT_EMAIL: 7x0bb03yq@mozmail.com
  BUILD_REPO: https://github.com/ekaaty/vinyl-theme
  REPO_DEV: ekaaty
  REPO_NAME: vinyl-theme
jobs:
  GetLatestVersion:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.step_version.outputs.VERSION }}
    steps:
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Get latest version
        id: step_version
        run: |
          # get latest release tag from remote

           latest_release_tag=$(curl -s https://api.github.com/repos/$REPO_DEV/$REPO_NAME/tags | jq -r '.[0].name')

           echo "INFO: Latest tag = $latest_release_tag"

           if [ ! -z $latest_release_tag ]; then
             latest_tag=$(echo $latest_release_tag | sed 's/v//')
             echo "VERSION=${latest_release_tag}" >> "$GITHUB_OUTPUT"
           else
             echo "Latest tag is unknown"
             exit 1
           fi

      - name: Checkout local
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ github.repository }}

      - name: Update README
        run: |
          echo ${{ steps.step_version.outputs.VERSION }}
          cat << EOF > README.md
            # darkly-aur-ci

            Scheduled pipeline (runs daily at ~12PM) to publish updated PKGBUILD/s for darkly and darkly-bin AUR packages.

            Upstream repository:  https://github.com/ekaaty/vinyl-theme

            AUR packages:

            - https://aur.archlinux.org/packages/vinyl

            [![Vinyl AUR CI](https://github.com/DeltaCopy/vinyl-aur-ci/actions/workflows/vinyl-aur-ci.yml/badge.svg)](https://github.com/DeltaCopy/vinyl-aur-ci/actions/workflows/vinyl-aur-ci.yml)

            ## Latest version
            <img src="https://img.shields.io/badge/vinyl-${{ steps.step_version.outputs.VERSION }}-orange" alt="vinyl-${{ steps.step_version.outputs.VERSION }}">
            
          EOF
          git config --global user.name $GIT_USER
          git config --global user.email ecto1@duck.com
          git add README.md
          git commit --allow-empty -m "[Vinyl AUR CI]: Update version"
          git push --force -v
  UpdatePackages:
    runs-on: ubuntu-latest
    needs: GetLatestVersion
    container: archlinux:latest
    steps:
      - name: Checkout local
        uses: actions/checkout@v4.2.0
        with:
          repository: ${{ github.repository }}
          sparse-checkout: .github/assets
          sparse-checkout-cone-mode: false

      - name: Initialize pacman-key
        run: pacman-key --init

      - name: System update
        run: pacman -Syu --noconfirm

      - name: Install additional packages
        run: |
          # openssh required for creating the ssh aur config
          # base-devel includes build dependencies (fakeroot, make, gcc, pkgconf)
          pacman -Syq base-devel openssh git --noconfirm

      - name: Setup build user
        run: |
          useradd --create-home --shell /bin/bash builduser -m # Create the builduser
          passwd -d builduser # Delete the buildusers password
          printf 'builduser ALL=(ALL) ALL\n' | tee -a /etc/sudoers # Allow the builduser passwordless sudo

      - name: Create SSH AUR config & clone
        env:
          AUR_PRIV: ${{ secrets.AUR_P1 }}
        run: |
          mkdir -p /home/builduser/.ssh
          touch /home/builduser/.ssh/known_hosts
          cp $GITHUB_WORKSPACE/.github/assets/ssh_config /home/builduser/.ssh/config

          chmod -vR 600 /home/builduser/.ssh/* 

          ssh-keyscan -v -t rsa,ecdsa,ed25519 aur.archlinux.org >>/home/builduser/.ssh/known_hosts

          echo "$AUR_PRIV" > /home/builduser/.ssh/aur
          chmod -R 600 /home/builduser/.ssh/aur*

          ssh-keygen -vy -f /home/builduser/.ssh/aur > /home/builduser/.ssh/aur.pub

          chown -vR builduser:builduser /home/builduser

      - name: Git clone AUR repos
        run: |
          sudo -u builduser bash -c 'git clone ${{ env.AUR_VINYL_REPO }} /tmp/vinyl'

          git config --global --add safe.directory '/tmp/vinyl'


          git config --global user.name ${{ env.GIT_USER}}
          git config --global user.email ${{ env.GIT_EMAIL}}

      - name: Update package files
        run: |
          echo ${{ needs.GetLatestVersion.outputs.VERSION }}

          latest_tag=$(echo ${{ needs.GetLatestVersion.outputs.VERSION }}| sed 's/v//')

          cp $GITHUB_WORKSPACE/.github/assets/vinyl/PKGBUILD.template /tmp/vinyl/PKGBUILD  
          cp $GITHUB_WORKSPACE/.github/assets/vinyl/.SRCINFO.template /tmp/vinyl/.SRCINFO

          if [ ! -z $latest_tag ]; then
            echo "RELEASE_VERSION=${latest_tag}" >> "$GITHUB_ENV"
            sed -i 's/${version}/'${latest_tag}'/' /tmp/vinyl/PKGBUILD
            sed -i 's/${version}/'${latest_tag}'/' /tmp/vinyl/.SRCINFO
            
            sha256sum_vinyl=$(curl -Ls https://github.com/$REPO_DEV/$REPO_NAME/archive/refs/tags/v${latest_tag}.tar.gz | sha256sum | awk {'print $1'})

            sed -i 's/${sha256sums}/'${sha256sum_vinyl}'/' /tmp/vinyl/PKGBUILD
            sed -i 's/${sha256sums}/'${sha256sum_vinyl}'/' /tmp/vinyl/.SRCINFO

          fi

          chown -R builduser:builduser /tmp/vinyl

      - name: Print pkgbuild & .srcinfo
        run: |
          cat /tmp/vinyl/PKGBUILD
          cat /tmp/vinyl/.SRCINFO

      - name: Set parallel makeflags
        run: sed -i 's/.*MAKEFLAGS=.*/MAKEFLAGS="-j $(nproc)"/' /etc/makepkg.conf

      - name: Test vinyl build & install
        run: |
          sudo -u builduser bash -c 'cd /tmp/vinyl; makepkg -si --noconfirm; test $? -eq 0 && touch /tmp/.vinylbuild'
          echo "VINYL_MODIFIED=$(git -C /tmp/vinyl status -s PKGBUILD | wc -l)" >> "$GITHUB_ENV"

      - name: Publish AUR package vinyl
        if: env.VINYL_MODIFIED == 1
        run: |
          echo "Changes found, publish required."
          if [ -f  /tmp/.vinylbuild ]; then
            sudo -u builduser bash -c 'cd /tmp/vinyl; git remote add aur "ssh://aur@aur.archlinux.org/vinyl.git"; \
            git config --global user.name ${{ env.GIT_USER}}
            git config --global user.email ${{ env.GIT_EMAIL}}
            git add -fv PKGBUILD .SRCINFO && git commit -m "[GitHub DeltaCopy/vinyl-aur-ci]: Version ${{ env.RELEASE_VERSION }}" && git push -v aur master'
          fi
